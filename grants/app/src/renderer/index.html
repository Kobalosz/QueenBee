<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grants</title>
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/atkinson-hyperlegible-next/wght.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="demo" class="banner demo" hidden><div class="wrap">Sample data. Nothing here is real, and anything you change disappears when you quit.</div></div>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path class="mark" d="M11 0l11 6v12l-11 6L0 18V6z"/></svg>
      <span>Grants</span> <span id="biz"></span>
    </div>
    <div class="top-right">
      <div class="clock" id="clock"></div>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </div>
</header>
<div id="update" class="banner update" hidden><div class="wrap"><span id="update-text"></span> <button class="link" data-act="install-update">Restart Grants now</button></div></div>
<div id="running" class="banner running" hidden><div class="wrap">The agent is working right now. This window updates on its own.</div></div>

<main id="dash" class="wrap">
  <section class="hero" aria-live="polite">
    <h1 id="headline">Loading…</h1>
    <p id="subline"></p>
    <p id="tally" class="tally" hidden></p>
    <div id="hero-actions" class="actions" hidden></div>
  </section>
  <div class="layout">
    <div id="main"></div>
    <aside id="aside" aria-label="Deadlines"></aside>
  </div>
</main>
<main id="setup" class="setup" hidden></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="setup.js"></script>
<script src="app.js"></script>
</body>
</html>
